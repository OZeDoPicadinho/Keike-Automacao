<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keike Stay · Login</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="login">
  <div class="login-card">
    <h1>Keike Stay</h1>
    <p>Experiência premium em hospedagens inteligentes</p>
    <form onsubmit="event.preventDefault(); window.location.href='/dashboard';">
      <input type="text" placeholder="Email ou usuário" required />
      <input type="password" placeholder="Senha" required />
      <button type="submit">Entrar</button>
      <a class="link" href="#">Esqueci minha senha</a>
    </form>
  </div>
</body>
</html>
